<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-4 md:p-8 font-sans bg-blue-100">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <p class="text-4xl font-bold ">Task List</p>
            </div>

            <div>
                <button onclick="openAddModal()" onclick=""
                    class="bg-violet-900 text-white  p-2 font-bold py-2 px-6 rounded-xl transition shadow-lg">
                    Add Task</button>
            </div>
        </div>

        <div class="bg-white hidden md:flex rounded-3xl p-6 mb-4 font-bold shadow-sm ">
            <div class="w-1/3 text-xl text-blue-400 ">Task</div>
            <div class="w-1/4 text-xl text-blue-400">Priority</div>
            <div class="w-1/4 text-xl text-blue-400 ">Status</div>
            <div class="w-1/6 text-xl text-right text-yellow-600 ">Action</div>
        </div>

        <div id="taskList" class="space-y-4">
        </div>
    </div>

    <div id="theModel" class="flex hidden fixed  p-4 z-50 inset-0 modal-overlay  items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8 relative">
            <button onclick="closeModal()" class="absolute top-6 right-8 text-3xl text-blue-500 hover:text-blue-700">
                <i class="fa-solid fa-square-xmark"></i>
            </button>

            <h2 id="modalTitle" class="text-2xl font-bold mb-6">Add Task</h2>

            <div class="space-y-6">
                <div>
                    <label class="block font-bold mb-2">Task</label>
                    <input type="text" id="taskInput" placeholder="Web Homework"
                        class="w-full border-2 border-blue-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 ring-blue-300">
                </div>

                <div>
                    <label class="block font-bold mb-2">Priority</label>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="selectPriority('High', this)"
                            class="pri-btn border-2 border-red-500 text-red-500 px-6 py-2 rounded-2xl font-semibold">High</button>
                        <button onclick="selectPriority('Medium', this)"
                            class="pri-btn border-2 border-yellow-500 text-yellow-500 px-4 py-2 rounded-2xl font-semibold">Medium</button>
                        <button onclick="selectPriority('Low', this)"
                            class="pri-btn border-2 border-green-500 text-green-500 px-6 py-2 rounded-2xl font-semibold">Low</button>
                    </div>
                </div>

                <div>
                    <label class="block font-bold mb-2">Status</label>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="selectStatus('To Do', this)"
                            class="status-btn border-2 border-blue-300 text-blue-300 px-4 py-2 rounded-2xl font-semibold">To
                            Do</button>
                        <button onclick="selectStatus('Progress', this)"
                            class="status-btn border-2 border-blue-300 text-blue-300  px-4 py-2 rounded-2xl font-semibold">Progress</button>
                        <button onclick="selectStatus('Done', this)"
                            class="status-btn border-2 border-blue-300 text-blue-300  px-4 py-2 rounded-2xl font-semibold">Done</button>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button id="cancelBtn" onclick="closeModal()"
                        class="hidden bg-red-500 hover:bg-red-600 text-white px-8 py-2 rounded-xl font-bold transition">
                        Cancel
                    </button>
                    <button id="submitBtn" onclick="handleTheTaskSubmit()"
                        class="bg-violet-700 hover:bg-violet-600 text-white px-10 py-2 rounded-xl font-bold transition">
                        Add
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="flex hidden fixed inset-0 items-center justify-center p-4 z-50 modal-overlay ">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-sm p-10 text-center">
            <h2 class="text-red-600 text-3xl font-bold mb-6">Are you sure?</h2>
            <div class="text-red-500 text-6xl mb-8">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <div class="flex justify-center gap-4">
                <button id="deleteButton"
                    class="bg-red-500 text-white px-8 py-2 rounded-xl font-bold active:scale-95">Yes</button>
                <button onclick="closeDeleteModal()"
                    class="bg-blue-500 text-white px-8 py-2 rounded-xl font-bold active:scale-95">No</button>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>

    <script>

    </script>



</body>

</html>
